# Every merge to main: tag the version and publish its GitHub release, unless it's already
# tagged (a docs- or CI-only merge keeps the version). The "Protect main" ruleset makes every push
# to main a PR merge. Deploying stays `make deploy` (docs/deployment.md, "Releasing").
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run python scripts/release.py --if-new
