[project]
name = "dota-analyst"
version = "0.1.2"
description = "Dota 2 analysis from Stratz for Claude: a plugin and its MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.1",
    "duckdb>=1.5.3",
    "google-cloud-storage>=3.15.0",
    "httpx>=0.28.1",
    "mcp>=2.2,<3",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.2",
    "pytz>=2026.4",  # DuckDB needs it to return TIMESTAMPTZ results (to_timestamp) to Python
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project.scripts]
dota-analyst-mcp = "dota_analyst_mcp.app:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "dota_analyst_mcp"
